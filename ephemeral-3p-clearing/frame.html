<!doctype html>
<meta charset="utf-8">
<title>Third-party storage frame</title>

<body>
  <h3>Third-party frame</h3>
  <p id="status"></p>
  <div id="css-cache-target"></div>

<script>
const params = new URLSearchParams(location.search);
const parentOrigin = params.get("parentOrigin") || "*";

const TEST_PATH = "/ephemeral-3p-clearing/";
const STORAGE_KEY = "brave_ephemeral_3p_probe";
const COOKIESTORE_KEY = "brave_ephemeral_3p_probe_cookie_store";
const DB_NAME = "brave_ephemeral_3p_probe_db";
const STORE = "store";
const CACHE_NAME = "brave-ephemeral-3p-cache";
const CACHE_STORAGE_URL = `${TEST_PATH}cache-storage-probe.txt`;

document.getElementById("status").textContent = `Frame origin: ${location.origin}`;

async function safe(fn) {
  try {
    return { ok: true, value: await fn() };
  } catch (e) {
    return { ok: false, error: `${e.name}: ${e.message}` };
  }
}

function unsupportedByHarness(reason) {
  return {
    ok: false,
    harnessUnsupported: true,
    error: reason,
  };
}

function resourceUrl(type, token) {
  const url = new URL(`${TEST_PATH}api/resource`, location.origin);
  url.searchParams.set("type", type);
  url.searchParams.set("token", token);
  return url.href;
}

function setCookieValue(value) {
  document.cookie =
    `${encodeURIComponent(STORAGE_KEY)}=${encodeURIComponent(value)}; ` +
    `Max-Age=3600; Path=/; SameSite=None; Secure`;

  return readCookieValue();
}

function readCookieValue() {
  const prefix = `${encodeURIComponent(STORAGE_KEY)}=`;

  const item = document.cookie
    .split("; ")
    .find((part) => part.startsWith(prefix));

  return item ? decodeURIComponent(item.slice(prefix.length)) : null;
}

function clearCookieValue() {
  document.cookie =
    `${encodeURIComponent(STORAGE_KEY)}=; ` +
    `Max-Age=0; Path=/; SameSite=None; Secure`;
}

async function writeCookieStore(value) {
  if (!("cookieStore" in window)) {
    throw new Error("CookieStore unsupported");
  }

  await cookieStore.set({
    name: COOKIESTORE_KEY,
    value,
    path: "/",
    sameSite: "none",
    secure: true,
    expires: Date.now() + 3600 * 1000,
  });

  return readCookieStore();
}

async function readCookieStore() {
  if (!("cookieStore" in window)) {
    throw new Error("CookieStore unsupported");
  }

  const cookie = await cookieStore.get(COOKIESTORE_KEY);
  return cookie ? cookie.value : null;
}

async function clearCookieStore() {
  if (!("cookieStore" in window)) return true;

  await cookieStore.delete({
    name: COOKIESTORE_KEY,
    path: "/",
  });

  return true;
}

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);

    req.onupgradeneeded = () => {
      req.result.createObjectStore(STORE);
    };

    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error("IndexedDB open blocked"));
  });
}

async function idbOp(mode, operation) {
  const db = await openDb();

  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, mode);
    const store = tx.objectStore(STORE);
    let requestResult;

    const req = operation(store);

    req.onsuccess = () => {
      requestResult = req.result;
    };

    req.onerror = () => {
      db.close();
      reject(req.error);
    };

    tx.oncomplete = () => {
      db.close();
      resolve(requestResult ?? null);
    };

    tx.onerror = () => {
      db.close();
      reject(tx.error);
    };

    tx.onabort = () => {
      db.close();
      reject(tx.error || new Error("IndexedDB transaction aborted"));
    };
  });
}

async function writeIndexedDB(value) {
  await idbOp("readwrite", (store) => store.put(value, STORAGE_KEY));
  return value;
}

async function readIndexedDB() {
  return idbOp("readonly", (store) => store.get(STORAGE_KEY));
}

async function clearIndexedDB() {
  await idbOp("readwrite", (store) => store.delete(STORAGE_KEY));
  return true;
}

async function writeCacheStorage(value) {
  if (!window.caches) throw new Error("CacheStorage unsupported");

  const cache = await caches.open(CACHE_NAME);
  const requestUrl = new URL(CACHE_STORAGE_URL, location.origin).href;

  await cache.put(requestUrl, new Response(value, {
    headers: { "Content-Type": "text/plain; charset=utf-8" },
  }));

  return value;
}

async function readCacheStorage() {
  if (!window.caches) throw new Error("CacheStorage unsupported");

  const cache = await caches.open(CACHE_NAME);
  const requestUrl = new URL(CACHE_STORAGE_URL, location.origin).href;
  const response = await cache.match(requestUrl);

  if (!response) return null;

  return response.text();
}

async function clearCacheStorage() {
  if (!window.caches) return true;

  await caches.delete(CACHE_NAME);
  return true;
}

async function httpCookieRequest(mode, token = "") {
  const url = new URL(`${TEST_PATH}api/http-cookie`, location.origin);
  url.searchParams.set("mode", mode);

  if (token) {
    url.searchParams.set("token", token);
  }

  const response = await fetch(url.href, {
    credentials: "include",
    cache: "no-store",
  });

  if (!response.ok) {
    throw new Error(`HTTP cookie endpoint failed: ${response.status}`);
  }

  const data = await response.json();
  return data.value ?? null;
}

async function writeHttpCookie(token) {
  return httpCookieRequest("write", token);
}

async function readHttpCookie() {
  return httpCookieRequest("read");
}

async function clearHttpCookie() {
  await httpCookieRequest("clear");
  return true;
}

async function probeFetchCache(token) {
  const response = await fetch(resourceUrl("fetch", token), {
    cache: "force-cache",
  });

  const data = await response.json();
  return data.value;
}

async function probeXhrCache(token) {
  const url = resourceUrl("xhr", token);

  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();

    xhr.open("GET", url);
    xhr.responseType = "json";

    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(xhr.response.value);
      } else {
        reject(new Error(`XHR failed: ${xhr.status}`));
      }
    };

    xhr.onerror = () => reject(new Error("XHR network error"));
    xhr.send();
  });
}

async function probeCssCache(token) {
  const old = document.getElementById("css-cache-probe-link");
  if (old) old.remove();

  const target = document.getElementById("css-cache-target");
  const link = document.createElement("link");

  link.id = "css-cache-probe-link";
  link.rel = "stylesheet";
  link.href = resourceUrl("css", token);

  await new Promise((resolve, reject) => {
    const timeout = setTimeout(() => reject(new Error("CSS load timed out")), 8000);

    link.onload = () => {
      clearTimeout(timeout);
      resolve();
    };

    link.onerror = () => {
      clearTimeout(timeout);
      reject(new Error("CSS load failed"));
    };

    document.head.appendChild(link);
  });

  return getComputedStyle(target)
    .getPropertyValue("--cache-probe-css")
    .trim()
    .replace(/^"|"$/g, "");
}

async function probeImageCache(token) {
  const img = new Image();

  await new Promise((resolve, reject) => {
    const timeout = setTimeout(() => reject(new Error("Image load timed out")), 8000);

    img.onload = () => {
      clearTimeout(timeout);
      resolve();
    };

    img.onerror = () => {
      clearTimeout(timeout);
      reject(new Error("Image load failed"));
    };

    img.src = resourceUrl("image", token);
  });

  return `${img.naturalWidth}x${img.naturalHeight}`;
}

async function probeScriptCache(token) {
  window.__resourceCacheProbe = window.__resourceCacheProbe || {};
  delete window.__resourceCacheProbe.script;

  const old = document.getElementById("script-cache-probe");
  if (old) old.remove();

  const script = document.createElement("script");
  script.id = "script-cache-probe";
  script.src = resourceUrl("script", token);

  await new Promise((resolve, reject) => {
    const timeout = setTimeout(() => reject(new Error("Script load timed out")), 8000);

    script.onload = () => {
      clearTimeout(timeout);
      resolve();
    };

    script.onerror = () => {
      clearTimeout(timeout);
      reject(new Error("Script load failed"));
    };

    document.body.appendChild(script);
  });

  return window.__resourceCacheProbe.script || null;
}

async function probeIframeCache(token) {
  const old = document.getElementById("iframe-cache-probe");
  if (old) old.remove();

  const iframe = document.createElement("iframe");
  iframe.id = "iframe-cache-probe";
  iframe.style.display = "none";
  iframe.src = resourceUrl("iframe", token);

  await new Promise((resolve, reject) => {
    const timeout = setTimeout(() => reject(new Error("Nested iframe load timed out")), 8000);

    iframe.onload = () => {
      clearTimeout(timeout);
      resolve();
    };

    iframe.onerror = () => {
      clearTimeout(timeout);
      reject(new Error("Nested iframe load failed"));
    };

    document.body.appendChild(iframe);
  });

  return iframe.contentWindow.document.body.dataset.cacheProbeValue || null;
}

async function clearAll() {
  return {
    localStorage: await safe(() => {
      localStorage.removeItem(STORAGE_KEY);
      return true;
    }),

    cookieJS: await safe(() => {
      clearCookieValue();
      return true;
    }),

    cookieHTTP: await safe(() => clearHttpCookie()),

    cookieStore: await safe(() => clearCookieStore()),

    indexedDB: await safe(() => clearIndexedDB()),

    cacheStorage: await safe(() => clearCacheStorage()),
  };
}

async function writeAll(token) {
  const cleanup = await clearAll();

  return {
    cleanup,

    altSvc: unsupportedByHarness(
      "Alt-Svc requires a custom protocol/server setup, not Cloudflare Pages."
    ),

    cacheStorage: await safe(() => writeCacheStorage(token)),

    cookieHTTP: await safe(() => writeHttpCookie(token)),

    cookieJS: await safe(() => setCookieValue(token)),

    cookieStore: await safe(() => writeCookieStore(token)),

    cssCache: await safe(() => probeCssCache(token)),

    faviconCache: unsupportedByHarness(
      "Favicon cache cannot be credibly observed from this iframe harness without server-side counters."
    ),

    fetchCache: await safe(() => probeFetchCache(token)),

    fontCache: unsupportedByHarness(
      "Font cache needs a server-side counter or a dynamically generated observable font."
    ),

    iframeCache: await safe(() => probeIframeCache(token)),

    imageCache: await safe(() => probeImageCache(token)),

    indexedDB: await safe(() => writeIndexedDB(token)),

    localStorage: await safe(() => {
      localStorage.setItem(STORAGE_KEY, token);
      return localStorage.getItem(STORAGE_KEY);
    }),

    prefetchCache: unsupportedByHarness(
      "Prefetch cache cannot be distinguished from ordinary HTTP cache here without server-side counters."
    ),

    scriptCache: await safe(() => probeScriptCache(token)),

    xhrCache: await safe(() => probeXhrCache(token)),
  };
}

async function readAll(token) {
  return {
    altSvc: unsupportedByHarness(
      "Alt-Svc requires a custom protocol/server setup, not Cloudflare Pages."
    ),

    cacheStorage: await safe(() => readCacheStorage()),

    cookieHTTP: await safe(() => readHttpCookie()),

    cookieJS: await safe(() => readCookieValue()),

    cookieStore: await safe(() => readCookieStore()),

    cssCache: await safe(() => probeCssCache(token)),

    faviconCache: unsupportedByHarness(
      "Favicon cache cannot be credibly observed from this iframe harness without server-side counters."
    ),

    fetchCache: await safe(() => probeFetchCache(token)),

    fontCache: unsupportedByHarness(
      "Font cache needs a server-side counter or a dynamically generated observable font."
    ),

    iframeCache: await safe(() => probeIframeCache(token)),

    imageCache: await safe(() => probeImageCache(token)),

    indexedDB: await safe(() => readIndexedDB()),

    localStorage: await safe(() => localStorage.getItem(STORAGE_KEY)),

    prefetchCache: unsupportedByHarness(
      "Prefetch cache cannot be distinguished from ordinary HTTP cache here without server-side counters."
    ),

    scriptCache: await safe(() => probeScriptCache(token)),

    xhrCache: await safe(() => probeXhrCache(token)),
  };
}

window.addEventListener("message", async (event) => {
  if (parentOrigin !== "*" && event.origin !== parentOrigin) return;

  const { id, cmd, token } = event.data || {};
  if (!id || !cmd) return;

  try {
    let result;

    if (cmd === "write") {
      result = await writeAll(token);
    } else if (cmd === "read") {
      result = await readAll(token);
    } else if (cmd === "clear") {
      result = await clearAll();
    } else {
      throw new Error(`Unknown command: ${cmd}`);
    }

    event.source.postMessage({ id, ok: true, result }, event.origin);
  } catch (e) {
    event.source.postMessage({
      id,
      ok: false,
      error: `${e.name}: ${e.message}`,
    }, event.origin);
  }
});
</script>
</body>
